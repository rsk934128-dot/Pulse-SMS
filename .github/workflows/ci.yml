name: Android CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare Config
        env:
          SECRET_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ ! -f app/google-services.json ] && [ -n "${SECRET_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            python3 -c "import base64, os; open('app/google-services.json','wb').write(base64.b64decode(''.join(os.environ['SECRET_GOOGLE_SERVICES_JSON_BASE64'].split())))"
          fi
          if [ -f debug.keystore.base64 ]; then
            python3 -c "import base64; open('debug.keystore','wb').write(base64.b64decode(''.join(open('debug.keystore.base64').read().split())))"
          fi
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ] || ! keytool -list -keystore debug.keystore -alias androiddebugkey -storepass android >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile & Run Unit Tests
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:testDebugUnitTest
          else
            gradle :app:testDebugUnitTest
          fi
